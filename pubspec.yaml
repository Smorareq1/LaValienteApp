name: la_valiente
description: "App de gestión para la lavandería La Valiente · Cobán."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  design_system:
    path: packages/design_system
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegación
  go_router: ^14.8.1

  # Red
  dio: ^5.7.0

  # Persistencia
  drift: ^2.28.0
  flutter_secure_storage: ^9.2.4

  # Operaciones funcionales
  fpdart: ^1.1.1
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  sqlite3: ^2.9.4

  # Cámara y galería para la foto del producto (§8.3). El recorte y la
  # compresión los hace el propio plugin al pedirle un tamaño máximo, así que no
  # entra una dependencia de imagen aparte.
  image_picker: ^1.1.2

  # El comprobante se comparte por el share sheet del sistema, que es por donde
  # sale WhatsApp (§17.1). No entra impresora térmica en la fase 1.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generación de código (Riverpod + Drift)
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.28.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
