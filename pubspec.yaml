name: la_valiente
description: "App de gestión para la lavandería La Valiente · Cobán."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  design_system:
    path: packages/design_system
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegación
  go_router: ^14.8.1

  # Red
  dio: ^5.7.0

  # Persistencia
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  flutter_secure_storage: ^9.2.4

  # Operaciones funcionales
  fpdart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generación de código (Riverpod + Drift)
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
